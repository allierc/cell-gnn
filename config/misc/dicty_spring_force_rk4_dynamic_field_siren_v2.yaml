# increase epoch to 8
description: "3D overdamped cells with spring forces + moving Gaussian field (GNN + SIREN)"
dataset: "dicty_spring_force_rk4_dynamic_field_siren_v2"

simulation:
  dimension: 3
  n_cells: 1000
  n_cell_types: 1
  n_frames: 8000
  delta_t: 0.002
  max_radius: 0.075
  min_radius: 0
  sigma: 0.005
  boundary: "periodic"
  dpos_init: 0
  cell_params: [[50.0, 0.05, 50.0, 0.07, 0.001, 0.033]]
  #              k_rep  r0   kadh  r_on  delta  mu_f
  func_params: [["spring", 0, 0]]
  noise_model_level: 0.0
  integration: "Runge-Kutta"
  field_params:
    center_0: [0.2, 0.5, 0.5]
    velocity: [0.15, 0.0, 0.0]
    amplitude: 1.0
    sigma: 0.15
    mu_chem: 0.02

graph_model:
  cell_model_name: "particle_spring_force_prescribed_field_siren"
  prediction: "first_derivative"
  input_size: 6
  output_size: 3
  hidden_dim: 128
  n_layers: 5
  aggr_type: "add"
  embedding_dim: 2
  update_type: "none"
  n_layers_field: 3
  hidden_dim_field: 128
  omega_field: 30.0

plotting:
  colormap: "tab10"
  arrow_length: 2
  xlim: [0, 0.12]
  invert_mlp1_sign: true

inr:
  inr_field_name: "velocity"
  inr_type: "siren_txyz"
  inr_gradient_mode: false
  hidden_dim_inr: 256
  n_layers_inr: 5
  omega_inr: 80.0
  inr_total_steps: 500000
  inr_batch_size: 8
  inr_learning_rate: 1.0e-5
  inr_xy_period: 1.0
  inr_t_period: 1.0

training:
  n_runs: 1
  device: "auto"
  n_epochs: 8
  batch_size: 8
  small_init_batch_size: False
  sparsity: "none"
  rotation_augmentation: True
  data_augmentation_loop: 20
  learning_rate_start: 1.0E-4
  learning_rate_embedding_start: 1.0E-5

  rollout:
  integration: "Runge-Kutta"

claude:
  n_epochs: 1
  data_augmentation_loop: 100
  n_iter_block: 24
  ucb_c: 1.414
  node_name: "a100"
