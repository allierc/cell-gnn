# v4 — STEP-BACK: passive diffusion-decay field, NO cell sources.
#
# Goal: verify the SIREN c-field + PDE MLP can learn c(x, t) on the simplest
# possible scenario before reintroducing cell emission, then internal state.
#
# Setup:
#   * Initial condition: single Gaussian blob at the box centre (amplitude 1).
#   * PDE: dc/dt = D * Laplacian(c) - lambda * c        (no source term)
#   * Cells: spring forces + small linear chemotaxis on grad(c).  Cells
#     don't affect c — the field is a deterministic, smooth, slowly-decaying
#     function of (x, t) that the SIREN should fit cleanly.
#
# If the SIREN c-field still doesn't match c_true on this scenario, the
# problem is upstream of the source/internal-state machinery.

description: "STEP-BACK: passive diffusion-decay (no sources) — SIREN/PDE-MLP sanity check"
dataset: "dicty_spring_force_rk4_diffusion_field_siren_grid_pde_v4"

simulation:
  dimension: 3
  n_cells: 1000
  n_cell_types: 1
  n_frames: 8000
  delta_t: 0.002
  max_radius: 0.075
  min_radius: 0
  sigma: 0.005
  boundary: "periodic"
  dpos_init: 0
  cell_params: [[50.0, 0.05, 50.0, 0.07, 0.001, 0.033]]
  #              k_rep  r0   kadh  r_on  delta  mu_f
  func_params: [["spring", 0, 0]]
  noise_model_level: 0.0
  integration: "Runge-Kutta"
  field_params:
    # PDE:  dc/dt = D * Laplacian(c) - lambda * c       (no source!)
    diffusion_coeff: 0.01
    lambda_decay:    0.05         # slow decay: exp(-0.05*16) ≈ 0.45 over the full run
    grid_resolution: 100
    source_strength: 0.0          # <-- NO cell emission
    source_fraction: 0.0
    pulse_period: 0
    pulse_duty: 1.0
    # Initial field: single Gaussian blob, amplitude 1
    center_0:
      - [0.50, 0.50, 0.50]
    amplitude: 1.0
    sigma:     0.08
    mu_chem:   0.1                # cells still feel grad(c), so v_pred is informative
    chem_saturation_scale: null

    model_grid_size: 32
    model_source_sigma: 0.02

graph_model:
  cell_model_name: "particle_spring_force_diffusion_field_siren_grid_pde"
  prediction: "first_derivative"
  input_size: 6
  output_size: 3
  hidden_dim: 128
  n_layers: 5
  aggr_type: "add"
  embedding_dim: 2
  update_type: "none"
  n_layers_field: 5
  hidden_dim_field: 128
  omega_field: 30.0
  pde_hidden_dim: 32
  pde_n_layers: 3

plotting:
  colormap: "tab10"
  arrow_length: 2
  xlim: [0, 0.15]
  invert_mlp1_sign: true

inr:
  inr_field_name: "velocity"
  inr_type: "siren_txyz"
  inr_gradient_mode: false
  hidden_dim_inr: 128
  n_layers_inr: 5
  omega_inr: 80.0
  inr_total_steps: 500000
  inr_batch_size: 8
  inr_learning_rate: 1.0e-5
  inr_xy_period: 1.0
  inr_t_period: 1.0

training:
  n_runs: 1
  device: "auto"
  n_epochs: 10
  batch_size: 8
  small_init_batch_size: False
  sparsity: "replace_embedding_function"
  sparsity_freq: 1
  cluster_method: "distance_plot"
  fix_cluster_embedding: True
  rotation_augmentation: True
  data_augmentation_loop: 20
  learning_rate_start: 1.0E-4
  learning_rate_embedding_start: 1.0E-5

  # --- Loss weights (now actually honored after schema fix) ---
  # Total loss = |v_pred - v_true|^2
  #            + pde_weight     * sum_grid (dc/dt_siren - MLP(c, Lap c, source))^2
  #            + pde_reg_weight * (ReLU(-c)^2 + c^2)
  pde_weight:     1.0e-3
  pde_reg_weight: 1.0e-4

  rollout:
  integration: "Runge-Kutta"
