# Diffusion-decay chemical field with SIREN scalar field on a FIXED MESH
# + learned PDE MLP (dc/dt = MLP(c, Laplacian(c), source))
#
# Data:  10% of cells emit source continuously (source_fraction=0.1, pulse_period=0).
# Model: particle_spring_force_diffusion_field_siren_grid_pde
#   - SIREN evaluated on a fixed grid; particles get grad(c) via trilinear interp.
#   - Source spread to grid via a normalised Gaussian kernel.
#   - Small MLP learns dc/dt from (c, Laplacian(c), source) — should recover
#     something close to the linear law  dc/dt = D*Lap - lambda*c + source.

description: "3D overdamped cells + diffusion field (GNN + SIREN-on-grid + learned PDE MLP); 10% constant emitters"
dataset: "dicty_spring_force_rk4_diffusion_field_siren_grid_pde_v2"

simulation:
  dimension: 3
  n_cells: 1000
  n_cell_types: 1
  n_frames: 8000
  delta_t: 0.002
  max_radius: 0.075
  min_radius: 0
  sigma: 0.005
  boundary: "periodic"
  dpos_init: 0
  cell_params: [[50.0, 0.05, 50.0, 0.07, 0.001, 0.033]]
  #              k_rep  r0   kadh  r_on  delta  mu_f
  func_params: [["spring", 0, 0]]
  noise_model_level: 0.0
  integration: "Runge-Kutta"
  field_params:
    # PDE: dc/dt = D * Laplacian(c) - lambda * c + alpha * sum_{i ∈ emitters} delta(x - x_i)
    diffusion_coeff: 0.01
    lambda_decay: 0.5
    grid_resolution: 100          # generator's FFT grid (data side)
    source_strength: 20.0
    # 10% of cells emit, continuously.
    source_fraction: 0.1          # 10% of cells chosen as emitters (fixed, seeded)
    pulse_period: 0               # 0 → constant emission (no pulsing)
    pulse_duty: 1.0               # unused when pulse_period=0
    # Initial field = 0 (built purely from cell sources)
    center_0:
      - [0.50, 0.50, 0.50]
    amplitude: 0.0
    sigma: 0.1
    mu_chem: 0.1
    chem_saturation_scale: null   # linear chemotaxis: F_chem = mu_chem * grad c

    # -------- Model-side grid & kernel parameters --------
    model_grid_size: 32           # per-axis grid count used by the SIREN-on-grid model
    model_source_sigma: 0.02      # Gaussian kernel width for depositing source to the model grid
    # (Defaults if omitted: model_grid_size = min(grid_resolution, 48),
    #                      model_source_sigma = 1.5 * grid spacing.)

graph_model:
  cell_model_name: "particle_spring_force_diffusion_field_siren_grid_pde"
  prediction: "first_derivative"
  input_size: 6
  output_size: 3
  hidden_dim: 128
  n_layers: 5
  aggr_type: "add"
  embedding_dim: 2
  update_type: "none"
  # SIREN scalar field net: (x, y, z, t) -> c
  n_layers_field: 5
  hidden_dim_field: 128
  omega_field: 30.0
  # PDE MLP: [c, Laplacian(c), source] -> dc/dt
  pde_hidden_dim: 32
  pde_n_layers: 3

plotting:
  colormap: "tab10"
  arrow_length: 2
  xlim: [0, 0.15]
  invert_mlp1_sign: true

inr:
  inr_field_name: "velocity"
  inr_type: "siren_txyz"
  inr_gradient_mode: false
  hidden_dim_inr: 128
  n_layers_inr: 5
  omega_inr: 80.0
  inr_total_steps: 500000
  inr_batch_size: 8
  inr_learning_rate: 1.0e-5
  inr_xy_period: 1.0
  inr_t_period: 1.0

training:
  n_runs: 1
  device: "auto"
  n_epochs: 10
  batch_size: 8
  small_init_batch_size: False
  sparsity: "replace_embedding_function"
  sparsity_freq: 1
  cluster_method: "distance_plot"
  fix_cluster_embedding: True
  rotation_augmentation: True
  data_augmentation_loop: 20
  learning_rate_start: 1.0E-4
  learning_rate_embedding_start: 1.0E-5

  # --- PDE residual loss weight ---
  # Total loss = |v_pred - v_true|^2
  #            + pde_weight * sum_grid (dc/dt_siren - MLP(c, Lap c, s))^2
  #            + pde_reg_weight * (ReLU(-c)^2 + c^2)
  pde_weight: 1.0e-3
  pde_reg_weight: 1.0e-4

  rollout:
  integration: "Runge-Kutta"
