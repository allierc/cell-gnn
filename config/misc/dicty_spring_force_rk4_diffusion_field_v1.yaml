# Diffusion-decay chemical field: dc/dt = D * laplacian(c) - lambda * c
description: "3D overdamped cells with spring forces + diffusion-decay field (GNN)"
dataset: "dicty_spring_force_rk4_diffusion_field_v1"

simulation:
  dimension: 3
  n_cells: 1000
  n_cell_types: 1
  n_frames: 8000
  delta_t: 0.002
  max_radius: 0.075
  min_radius: 0
  sigma: 0.005
  boundary: "periodic"
  dpos_init: 0
  cell_params: [[50.0, 0.05, 50.0, 0.07, 0.001, 0.033]]
  #              k_rep  r0   kadh  r_on  delta  mu_f
  func_params: [["spring", 0, 0]]
  noise_model_level: 0.0
  integration: "Runge-Kutta"
  field_params:
    # PDE: dc/dt = D * laplacian(c) - lambda * c + alpha * sum_i delta(x - x_i)
    diffusion_coeff: 0.001       # D
    lambda_decay: 0.1            # lambda
    grid_resolution: 64          # grid points per axis
    source_strength: 0.01        # alpha — chemical secretion rate per cell
    # Initial condition: Gaussian blobs
    center_0:
      - [0.20, 0.30, 0.50]
      - [0.70, 0.50, 0.50]
      - [0.40, 0.80, 0.50]
      - [0.60, 0.20, 0.50]
    amplitude: 1.0
    sigma: 0.05
    mu_chem: 0.02

graph_model:
  cell_model_name: "particle_spring_force_diffusion_field"
  prediction: "first_derivative"
  input_size: 6
  output_size: 3
  hidden_dim: 128
  n_layers: 5
  aggr_type: "add"
  embedding_dim: 2
  update_type: "none"

plotting:
  colormap: "tab10"
  arrow_length: 2
  xlim: [0, 0.12]
  invert_mlp1_sign: true

training:
  n_runs: 1
  device: "auto"
  n_epochs: 10
  batch_size: 8
  small_init_batch_size: False
  sparsity: "replace_embedding_function"
  sparsity_freq: 1
  cluster_method: "distance_plot"
  fix_cluster_embedding: True
  rotation_augmentation: True
  data_augmentation_loop: 20
  learning_rate_start: 1.0E-4
  learning_rate_embedding_start: 1.0E-5

  rollout:
  integration: "Runge-Kutta"
