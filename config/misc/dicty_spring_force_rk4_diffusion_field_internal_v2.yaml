# v2 — same dynamics as v1, retraining-only changes:
#   * `pde_weight` and `pde_reg_weight` are now actually honored (added to the
#     Pydantic schema). v1 ran with the silent fallback `pde_weight=1.0` which
#     made the PDE residual term ~10^7 larger than every other loss component
#     and starved the internal MLP of gradient.
#   * `internal_weight` bumped 100x to put the internal-ODE residual on roughly
#     the same OOM as the position MSE in absolute units.
#
# Reuse v1's generated data via a symlink:
#   ln -s dicty_spring_force_rk4_diffusion_field_internal_v1 \
#         graphs_data/misc/dicty_spring_force_rk4_diffusion_field_internal_v2

description: "v2: rebalanced loss weights for internal-state model (data shared with v1)"
dataset: "dicty_spring_force_rk4_diffusion_field_internal_v2"

simulation:
  dimension: 3
  n_cells: 1000
  n_cell_types: 1
  n_frames: 8000
  delta_t: 0.002
  max_radius: 0.075
  min_radius: 0
  sigma: 0.005
  boundary: "periodic"
  dpos_init: 0
  cell_params: [[50.0, 0.05, 50.0, 0.07, 0.001, 0.033]]
  func_params: [["spring", 0, 0]]
  noise_model_level: 0.0
  integration: "Runge-Kutta"
  field_params:
    diffusion_coeff: 0.01
    lambda_decay: 0.5
    grid_resolution: 100
    source_strength: 20.0
    source_fraction: 1.0
    pulse_period: 0
    pulse_duty: 1.0
    center_0:
      - [0.50, 0.50, 0.50]
    amplitude: 0.0
    sigma: 0.1
    mu_chem: 0.1
    chem_saturation_scale: null

    internal_a:        50.0
    internal_c_half:   0.05
    internal_tau:      0.5
    internal_init_range: [0.0, 1.0]

    model_grid_size: 32
    model_source_sigma: 0.02

graph_model:
  cell_model_name: "particle_spring_force_diffusion_field_siren_grid_pde_internal"
  prediction: "first_derivative"
  input_size: 6
  output_size: 3
  hidden_dim: 128
  n_layers: 5
  aggr_type: "add"
  embedding_dim: 2
  update_type: "none"
  n_layers_field: 5
  hidden_dim_field: 128
  omega_field: 30.0
  pde_hidden_dim: 32
  pde_n_layers: 3
  internal_hidden_dim: 16
  internal_n_layers: 2

plotting:
  colormap: "tab10"
  arrow_length: 2
  xlim: [0, 0.15]
  invert_mlp1_sign: true

inr:
  inr_field_name: "velocity"
  inr_type: "siren_txyz"
  inr_gradient_mode: false
  hidden_dim_inr: 64
  n_layers_inr: 5
  omega_inr: 60.0
  inr_total_steps: 500000
  inr_batch_size: 8
  inr_learning_rate: 1.0e-5
  inr_xy_period: 1.0
  inr_t_period: 1.0

training:
  n_runs: 1
  device: "auto"
  n_epochs: 10
  batch_size: 8
  small_init_batch_size: False
  sparsity: "replace_embedding_function"
  sparsity_freq: 1
  cluster_method: "distance_plot"
  fix_cluster_embedding: True
  rotation_augmentation: True
  data_augmentation_loop: 20
  learning_rate_start: 1.0E-4
  learning_rate_embedding_start: 1.0E-5

  # --- Loss weights (now actually applied) ---
  pde_weight:      1.0e-3
  pde_reg_weight:  1.0e-4
  internal_weight: 1.0       # was 1.0e-2 in v1 — bumped because internal residual sums over only N cells, vs ~N^3 for the PDE.

  rollout:
  integration: "Runge-Kutta"
