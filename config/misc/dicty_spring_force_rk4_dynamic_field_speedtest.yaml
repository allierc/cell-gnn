description: "Speed test: small sim to verify training optimizations work"
dataset: "dicty_spring_force_rk4_dynamic_field_speedtest"

simulation:
  dimension: 3
  n_cells: 100
  n_cell_types: 1
  n_frames: 200
  delta_t: 0.002
  max_radius: 0.075
  min_radius: 0
  sigma: 0.005
  boundary: "periodic"
  dpos_init: 0
  cell_params: [[50.0, 0.05, 50.0, 0.07, 0.001, 0.033]]
  func_params: [["spring", 0, 0]]
  noise_model_level: 0.0
  integration: "Runge-Kutta"
  field_params:
    center_0: [0.2, 0.5, 0.5]
    velocity: [0.15, 0.0, 0.0]
    amplitude: 1.0
    sigma: 0.15
    mu_chem: 0.5

graph_model:
  cell_model_name: "particle_spring_force_dynamic_field"
  prediction: "first_derivative"
  input_size: 6
  output_size: 3
  hidden_dim: 64
  n_layers: 3
  aggr_type: "add"
  embedding_dim: 2
  update_type: "none"

plotting:
  colormap: "tab10"
  arrow_length: 2
  xlim: [0, 0.12]
  invert_mlp1_sign: true

training:
  n_runs: 1
  device: "auto"
  n_epochs: 2
  batch_size: 4
  small_init_batch_size: False
  sparsity: "none"
  rotation_augmentation: True
  data_augmentation_loop: 2
  learning_rate_start: 1.0E-4
  learning_rate_embedding_start: 1.0E-5

  rollout:
  integration: "Runge-Kutta"
